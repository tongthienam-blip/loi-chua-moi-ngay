version: '3.8'

services:
  # Ứng dụng Next.js "Lời Chúa Mỗi Ngày"
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: loi-chua-moi-ngay:latest
    container_name: catholic_bible_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - DATABASE_URL=postgresql://bible_admin:SecureCatholicPass2026@postgres:5432/catholic_bible_db?schema=public
      - JWT_SECRET=catholic-bible-platform-secure-jwt-secret-key-2026
    depends_on:
      - postgres
    networks:
      - catholic_network

  # Cơ sở dữ liệu PostgreSQL cho dữ liệu Kinh Thánh và Phụng Vụ
  postgres:
    image: postgres:16-alpine
    container_name: catholic_bible_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: catholic_bible_db
      POSTGRES_USER: bible_admin
      POSTGRES_PASSWORD: SecureCatholicPass2026
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - catholic_network

networks:
  catholic_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
